<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Fretwise Guitar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — sticky top bar, one view at a time, bottom tab bar on phones / side-free top tabs on wide screens.
   Palette from the instrument: rosewood fretboard, nickel frets, abalone-green inlay, brass tuning pegs. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e8ece6; --line:#d3d9d0;
  --ink:#1c2420; --ink-2:#57625c; --accent:#0e7a68; --accent-ink:#ffffff; --accent-soft:#d5ece6;
  --brass:#b7791f; --brass-soft:#f6e7cc; --wood:#4a2f24; --wood-2:#6b4535; --fret:#c9cdd1; --string:#e9dcc1;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c2412d;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --surface-2:#232b27; --line:#2f3a35;
  --ink:#e8eee9; --ink-2:#9aa8a0; --accent:#3cc4ab; --accent-ink:#06201b; --accent-soft:#183a33;
  --brass:#e0a646; --brass-soft:#3a2e18; --wood:#2b1b15; --wood-2:#3d281f; --fret:#8b9196; --string:#cdbf9f;
  --good:#45c27a; --warn:#e0a646; --bad:#ef6b55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --surface-2:#232b27; --line:#2f3a35;
  --ink:#e8eee9; --ink-2:#9aa8a0; --accent:#3cc4ab; --accent-ink:#06201b; --accent-soft:#183a33;
  --brass:#e0a646; --brass-soft:#3a2e18; --wood:#2b1b15; --wood-2:#3d281f; --fret:#8b9196; --string:#cdbf9f;
  --good:#45c27a; --warn:#e0a646; --bad:#ef6b55; color-scheme:dark}

*{box-sizing:border-box}
pre,code,textarea,.sheet .ln,.tabblock pre{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:-.01em}
.brand svg{width:28px;height:28px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 8px;border-radius:10px;flex:1}
  .tab svg{width:22px;height:22px}
}
@media (min-width:721px){body{padding-bottom:32px}}

main{padding-block:20px 32px}
.view{display:grid;gap:20px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.easy{background:var(--accent-soft);color:var(--accent)}
.chip.mid{background:var(--brass-soft);color:var(--brass)}
.field{display:grid;gap:4px}
.field label{font-size:.8rem;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%}
textarea{font-family:var(--f-mono);font-size:.85rem;line-height:1.45;min-height:260px;resize:vertical;white-space:pre;overflow-x:auto}
input[type=range]{accent-color:var(--accent);width:100%}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.note{border-left:3px solid var(--brass);background:var(--brass-soft);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;font-size:.9rem;max-width:calc(100% - 32px)}

/* tuner */
.tuner{display:grid;gap:18px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:820px){.tuner{grid-template-columns:minmax(0,1fr)}}
.gauge{background:var(--wood);color:#f4ead6;border-radius:var(--r);padding:22px 18px 18px;display:grid;gap:14px;justify-items:center;position:relative;overflow:hidden}
.gauge .notename{font-family:var(--f-display);font-weight:800;font-size:5.5rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gauge .notename sub{font-size:1.6rem;font-weight:600;opacity:.6;vertical-align:baseline;margin-left:2px}
.gauge .readout{font-family:var(--f-mono);font-size:.9rem;opacity:.85;font-variant-numeric:tabular-nums}
.gauge > svg{width:100%;max-width:420px;height:auto}
.gauge .status{font-weight:700;font-size:.95rem;min-height:1.4em}
.strings{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.strbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 4px;cursor:pointer;display:grid;justify-items:center;gap:2px}
.strbtn b{font-family:var(--f-display);font-size:1.3rem}
.strbtn span{font-size:.7rem;color:var(--ink-2);font-family:var(--f-mono)}
.strbtn.on{border-color:var(--accent);background:var(--accent-soft)}
.strbtn.tuned{border-color:var(--good)}

/* lessons */
.levels{display:grid;gap:22px}
.level h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.level h2 .chip{font-family:var(--f-body)}
.lessons{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:10px}
.lcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.lcard:hover{border-color:var(--accent)}
.lcard .num{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2)}
.lcard.done{background:var(--accent-soft);border-color:transparent}
.lcard.done .num::after{content:" · done";color:var(--accent);font-weight:600}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lesson{display:grid;gap:18px;max-width:760px}
.lesson .prose{display:grid;gap:12px;font-size:1rem}
.lesson .prose p,.lesson .prose li{max-width:66ch}
.lesson .prose ul,.lesson .prose ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.lesson .prose h3{margin-top:10px}
.tasks{display:grid;gap:8px}
.tasks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tasks input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.embed{display:grid;gap:10px}

/* tab blocks */
.tabblock{background:var(--surface-2);border-radius:var(--r-sm);overflow-x:auto;padding:12px 14px}
.tabblock pre{margin:0;font-family:var(--f-mono);font-size:.88rem;line-height:1.35}

/* chords */
.chordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.chordcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 6px 6px;display:grid;justify-items:center;cursor:pointer;gap:0}
.chordcard:hover{border-color:var(--accent)}
.chordcard .cn{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.chordcard svg{width:100%;max-width:110px;height:auto}
.chordstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chordstrip .chordcard{flex:0 0 96px}

/* songs */
.songlist{display:grid;gap:8px}
.songrow{display:flex;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%}
.songrow:hover{border-color:var(--accent)}
.songrow .t{font-weight:700;font-size:1.02rem}
.songrow .meta{font-size:.82rem;color:var(--ink-2)}
.songrow .keybadge{flex:none;width:44px;height:44px;border-radius:10px;background:var(--wood);color:#f4ead6;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.songrow .keybadge.user{background:var(--accent)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;overflow-x:auto}
.sheet .ln{font-family:var(--f-mono);white-space:pre;line-height:1.35;min-height:1.35em}
.sheet .ch{color:var(--accent);font-weight:600}
.sheet .ch button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.sheet .ch button:hover{text-decoration:underline}
.sheet .sec{font-family:var(--f-display);font-weight:700;color:var(--brass);margin-top:14px;margin-bottom:2px;white-space:normal}
.sheet .cmt{font-style:italic;color:var(--ink-2);white-space:normal;font-family:var(--f-body)}
.sheet .tabln{color:var(--ink);background:var(--surface-2)}
.sheet .tabln.first{border-radius:6px 6px 0 0;padding-top:4px}
.sheet .tabln.last{border-radius:0 0 6px 6px;padding-bottom:4px;margin-bottom:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:10;background:var(--bg);padding-block:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.stepper button{border:0;background:none;padding:7px 10px;cursor:pointer;font-weight:700}
.stepper span{min-width:62px;text-align:center;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.shots{display:grid;gap:10px}
.shots img{border-radius:var(--r-sm);border:1px solid var(--line);width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700;line-height:1}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;justify-items:center;text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.editor{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.editor{grid-template-columns:minmax(0,1fr)}}
.formgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

/* practice */
.practice{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bpm{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.beats{display:flex;gap:8px}
.beats i{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.beats i.on{background:var(--accent);border-color:var(--accent)}
.beats i.on.acc{background:var(--brass);border-color:var(--brass)}
.flash{display:grid;justify-items:center;gap:4px;padding:8px}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1}
.flash svg{width:150px;height:auto}
.strum{display:flex;gap:4px;flex-wrap:wrap}
.strum span{width:34px;height:42px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-family:var(--f-mono);font-size:.95rem;color:var(--ink-2)}
.strum span.hit{color:var(--ink)}
.strum span.now{background:var(--accent);color:var(--accent-ink)}
.strum span small{display:block;font-size:.6rem;font-weight:500;color:var(--ink-2)}
.fretwrap{overflow-x:auto}
.fretwrap svg{min-width:560px;width:100%;height:auto;display:block}
table.keys{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}
table.keys th,table.keys td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left}
table.keys th{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tablewrap{overflow-x:auto}
.savebar{position:sticky;bottom:0;background:var(--bg);padding-block:10px;border-top:1px solid var(--line)}
@media (max-width:720px){.savebar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.rec.primary{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.recrow{display:flex;gap:18px;align-items:flex-start}
.recdia{width:120px;flex:none}
@media (max-width:480px){.recrow{flex-direction:column}.recdia{width:110px}}
.chordcard.known{background:var(--accent-soft);border-color:var(--accent)}
.chordcard.known .cn{color:var(--accent)}
.notebtns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.keycell{display:grid;gap:4px;justify-items:center}
.keycell .eyebrow{text-transform:none;font-family:var(--f-display);font-size:.9rem;letter-spacing:0;color:var(--brass)}
.keycell .chordcard{width:100%}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;justify-items:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
<!--SPLIT-->
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand" aria-label="Fretwise">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="7" fill="var(--wood)"/><g stroke="var(--fret)" stroke-width="1.4"><line x1="9" y1="7" x2="9" y2="25"/><line x1="16" y1="7" x2="16" y2="25"/><line x1="23" y1="7" x2="23" y2="25"/></g><g stroke="var(--string)" stroke-width="1"><line x1="6" y1="11" x2="26" y2="11"/><line x1="6" y1="16" x2="26" y2="16"/><line x1="6" y1="21" x2="26" y2="21"/></g><circle cx="19.5" cy="16" r="3" fill="var(--accent)"/></svg>
      Fretwise
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filepick" accept="image/*" multiple hidden>
<input type="file" id="jsonpick" accept=".json,.txt,.pro,.chopro,.cho,application/json,text/plain" hidden>

<script>
"use strict";
/* ===================== tiny helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2400){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const ICON = {
  tune:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 16l4-6"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9-3 9 3-9 3z"/><path d="M7 8v5c0 1.5 2.2 3 5 3s5-1.5 5-3V8"/></svg>',
  practice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l3 18H6z"/><path d="M12 15l4-9"/></svg>',
  chords:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 9h14M5 14h14M10 3v18M14 3v18" stroke-width="1.2"/><circle cx="12" cy="11.5" r="1.8" fill="currentColor"/></svg>',
  songs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
};

/* ===================== music theory ===================== */

const SHAPES = {

function qualityFamily(q){
  if (/^(5)$/.test(q)) return "5";
  if (/^(m7b5|ø)/.test(q)) return "m7b5";
  if (/^(dim|°)/.test(q)) return "dim";
  if (/^(maj7|M7|maj9)/.test(q)) return "maj7";
  if (/^(m7|min7|m9|m11)/.test(q)) return "m7";
  if (/^(m|min)(?!aj)/.test(q)) return "m";
  if (/^(7|9|11|13)/.test(q)) return "7";

function shapeFor(sym){
  const s = String(sym).replace(/^\(|\)$/g, "");
  if (CHORDS[s]) return toShape(CHORDS[s]);
  const p = parseChord(s); if (!p) return null;
  const root = NICE[NOTE_IDX[p.root]] ?? p.root;
  const alias = root + p.q;
  if (CHORDS[alias]) return toShape(CHORDS[alias]);
  const fam = qualityFamily(p.q);
  if (CHORDS[root + fam]) return toShape(CHORDS[root + fam]);
  // pick the lowest-fret movable shape
  let best = null;
  for (const [base, lowString] of [["E",40],["A",45]]){
    const tpl = SHAPES[base][fam]; if (!tpl) continue;
    let r = ((NOTE_IDX[p.root] - (lowString % 12)) % 12 + 12) % 12; if (r === 0) r = 12;

}

function chordSVG(name, shape, opts = {}){
  if (!shape) return `<svg viewBox="0 0 100 136"><text x="50" y="68" text-anchor="middle" fill="var(--ink-2)" font-size="11">no diagram</text></svg>`;
  const { frets, fingers } = shape;
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 0;
  const base = maxF <= 4 ? 1 : minF;
  const X0 = 26, DX = 12, Y0 = 26, DY = 18, N = 5;
  let s = `<svg viewBox="0 0 100 136" role="img" aria-label="${esc(name)} chord diagram">`;
  // nut / position
  if (base === 1) s += `<rect x="${X0-1}" y="${Y0-4}" width="${DX*5+2}" height="4" fill="var(--ink)"/>`;
  else s += `<text x="${X0-6}" y="${Y0+DY*0.5+4}" text-anchor="end" font-size="10" fill="var(--ink-2)" font-family="var(--f-mono)">${base}fr</text>`;
  for (let i = 0; i <= N; i++) s += `<line x1="${X0}" x2="${X0+DX*5}" y1="${Y0+i*DY}" y2="${Y0+i*DY}" stroke="var(--line)" stroke-width="1.2"/>`;
  for (let i = 0; i < 6; i++) s += `<line x1="${X0+i*DX}" x2="${X0+i*DX}" y1="${Y0}" y2="${Y0+N*DY}" stroke="var(--ink-2)" stroke-width="${1.6 - i*0.15}"/>`;
  // barre
  const one = frets.map((f,i) => fingers[i] === 1 && f === minF ? i : -1).filter(i => i >= 0);
  if (one.length > 1 && minF > 0){
    const y = Y0 + (minF - base + 0.5) * DY;
    s += `<rect x="${X0+one[0]*DX-5}" y="${y-5}" width="${(one[one.length-1]-one[0])*DX+10}" height="10" rx="5" fill="var(--accent)"/>`;
  }
  frets.forEach((f, i) => {
    const x = X0 + i * DX;
    if (f < 0) s += `<text x="${x}" y="${Y0-8}" text-anchor="middle" font-size="10" fill="var(--ink-2)">×</text>`;
    else if (f === 0) s += `<circle cx="${x}" cy="${Y0-11}" r="3.4" fill="none" stroke="var(--ink-2)" stroke-width="1.3"/>`;
    else {
      const y = Y0 + (f - base + 0.5) * DY;
      s += `<circle cx="${x}" cy="${y}" r="5.6" fill="var(--accent)"/>`;
      if (fingers[i] && !opts.noFingers) s += `<text x="${x}" y="${y+3.4}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--accent-ink)">${fingers[i]}</text>`;
    }
  });
  s += `<text x="${X0+DX*2.5}" y="${Y0+N*DY+16}" text-anchor="middle" font-size="9" fill="var(--ink-2)" font-family="var(--f-mono)">${frets.map(f => f < 0 ? "x" : f).join(" ")}</text>`;
  return s + `</svg>`;
}

const Audio = {
  ctx:null, master:null, cache:new Map(),
  ensure(){
    if (!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.7; this.master.connect(this.ctx.destination); }

    return this.ctx;
  },
  // Karplus–Strong plucked string
  buffer(freq, dur = 2.6){
    const key = Math.round(freq * 10) + ":" + dur;
    if (this.cache.has(key)) return this.cache.get(key);
    const sr = this.ctx.sampleRate, len = Math.floor(sr * dur), buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    const N = Math.max(2, Math.round(sr / freq)); const ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    let p = 0, prev = 0; const decay = 0.996 - Math.min(0.006, freq / 200000);
    for (let i = 0; i < len; i++){ const cur = ring[p]; const nxt = ring[(p + 1) % N]; const v = decay * 0.5 * (cur + nxt); ring[p] = v; d[i] = cur * 0.6 + prev * 0.4; prev = cur; p = (p + 1) % N; }
    this.cache.set(key, buf); return buf;
  },
  pluck(freq, when = 0, vol = 0.5, dur = 2.6){
    const ctx = this.ensure(); if (!ctx) return;
    const src = ctx.createBufferSource(); src.buffer = this.buffer(freq, dur);
    const g = ctx.createGain(); g.gain.value = vol; src.connect(g); g.connect(this.master);
    const t = ctx.currentTime + when; src.start(t); g.gain.setTargetAtTime(0, t + dur - 0.4, 0.1);
  },
  strum(sym, { when = 0, up = false, vol = 0.32, gap = 0.022, dur = 2.2 } = {}){
    const sh = shapeFor(sym); if (!sh) return;
    let notes = sh.frets.map((f, i) => f < 0 ? null : STD[i] + f).filter(n => n != null);
    if (up) notes = notes.reverse().slice(0, 4);
    notes.forEach((m, i) => this.pluck(midiToFreq(m), when + i * gap, vol, dur));

  click(when, accent){
    const ctx = this.ensure(); const o = ctx.createOscillator(), g = ctx.createGain();

  },

    let t = 0.05; const spb = 60 / bpm;
    for (const [m, b] of notes){ (Array.isArray(m) ? m : [m]).forEach(x => this.pluck(midiToFreq(x), t, 0.45, 1.6)); t += b * spb; }
    return t;
  },
};

// dots: [{s: 0..5 (0 = high e), f, label, root}]
function fretboardSVG({ from = 0, to = 12, dots = [], labelStrings = true }){
  const frets = to - from; const W = 40 + frets * 52 + 20, H = 150, top = 22, gap = 20;
  const x = f => 40 + (f - from) * 52; const y = s => top + s * gap;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Fretboard diagram">`;
  s += `<rect x="40" y="${top-8}" width="${frets*52}" height="${gap*5+16}" rx="4" fill="var(--wood)"/>`;
  const inl = [3,5,7,9,15,17]; for (const f of inl) if (f > from && f <= to) s += `<circle cx="${x(f)-26}" cy="${top+gap*2.5}" r="5" fill="var(--wood-2)"/>`;
  if (12 > from && 12 <= to){ s += `<circle cx="${x(12)-26}" cy="${top+gap*1.5}" r="5" fill="var(--wood-2)"/><circle cx="${x(12)-26}" cy="${top+gap*3.5}" r="5" fill="var(--wood-2)"/>`; }
  for (let f = from; f <= to; f++) s += `<line x1="${x(f)}" x2="${x(f)}" y1="${top-8}" y2="${top+gap*5+8}" stroke="var(--fret)" stroke-width="${f === 0 ? 6 : 2}"/>`;
  const names = ["e","B","G","D","A","E"];
  for (let i = 0; i < 6; i++){ s += `<line x1="40" x2="${x(to)}" y1="${y(i)}" y2="${y(i)}" stroke="var(--string)" stroke-width="${0.8 + i*0.35}"/>`; if (labelStrings) s += `<text x="24" y="${y(i)+4}" text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="var(--ink-2)">${names[i]}</text>`; }
  for (let f = Math.max(1, from + 1); f <= to; f++) s += `<text x="${x(f)-26}" y="${H-6}" text-anchor="middle" font-size="10" font-family="var(--f-mono)" fill="var(--ink-2)">${f}</text>`;
  for (const d of dots){
    const cx = d.f === 0 ? x(from) - 12 : x(d.f) - 26;
    s += `<circle cx="${cx}" cy="${y(d.s)}" r="9" fill="${d.root ? "var(--brass)" : "var(--accent)"}" stroke="var(--wood)" stroke-width="1.5"/>`;
    if (d.label) s += `<text x="${cx}" y="${y(d.s)+3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${d.root ? "#1c1408" : "var(--accent-ink)"}">${esc(d.label)}</text>`;
  }
  return s + `</svg>`;
}

<p>Knowing a chord and switching to it on the beat are two different skills. Most players who "know the chords" lose time on the change. The fix is a focused drill called <b>one-minute changes</b>.</p>
<h3>How the drill works</h3>
<ol><li>Pick two chords that give you trouble, for example C and G.</li><li>Set a 60-second timer. Strum each chord once, then switch. Count every successful switch.</li><li>Write down your score. Repeat daily. Most people double their score within two weeks.</li></ol>
{{chords:C,G,Am,D,Em}}
<h3>Tricks that speed up changes</h3>
<ul><li><b>Anchor fingers.</b> Between C and Am, your 1st and 2nd fingers don't move. Only the 3rd finger travels.</li><li><b>Pivot fingers.</b> From G to Em, keep the 2nd finger in contact and slide the rest.</li><li><b>Move as a shape.</b> Lift all fingers together and land them together instead of placing them one by one.</li><li><b>The last eighth note is free.</b> In a real song, release the old chord on the "and" of beat 4. An open strum there sounds fine and buys you time.</li></ul>
{{tool:changes}}`,
    tasks:["Score 30+ changes in one minute on C ↔ G","Score 30+ on Am ↔ D","Play C – G – Am – Em in time at 70 BPM, one strum per beat"] },
  { id:"strum", level:"l1", title:"Strumming patterns that groove", min:20, body:`
<p>Strumming is a pendulum. Your hand moves <b>down on every beat and up on every "and"</b>, all the time. A pattern is just choosing which of those swings actually hit the strings.</p>
<h3>Pattern 1: the "folk" strum</h3>
<p>Down, down-up, up-down-up. Count it: <b>1, 2 &, &, 4 &</b>. The hand still swings on beat 3, it just misses the strings.</p>
{{strum:D.DU.UDU|G,C,D,G}}
<h3>Pattern 2: the pop push</h3>
<p>Two steady downs, then down-up through beats 3 and 4. Count <b>1, 2, 3 & 4 &</b> and lean on beat 1.</p>
{{strum:D.D.DUDU|C,Am,F,G}}
<h3>Pattern 3: 3/4 waltz</h3>
<p>For songs in three, like Amazing Grace and Scarborough Fair: a strong bass note, then two lighter strums.</p>
{{strum:D.D.DU|G,C,G,D}}
<p class="note">Keep your wrist loose and hold the pick lightly, with about 2–3 mm showing. Tension makes strumming sound choppy.</p>`,
    tasks:["Play pattern 1 for two minutes without stopping at 80 BPM","Play pattern 2 over C – Am – F – G","Strum Amazing Grace with the 3/4 pattern"] },
  { id:"tabs", level:"l1", title:"How to read tabs", min:10, body:`
<p>Tablature (tab) shows <b>where</b> to put your fingers rather than which notes they are. It's the fastest way to learn riffs and melodies, and it's what most songs online use.</p>
{{tab:reading}}
<h3>Symbols you'll see</h3>
<ul><li><code>h</code> hammer-on: pick the first note, then slam a finger down for the second without picking.</li><li><code>p</code> pull-off: the reverse. Flick the finger off to sound the lower note.</li><li><code>/</code> and <code>\\</code> slide up or down while holding pressure.</li><li><code>b</code> bend the string up. <code>7b9</code> means bend fret 7 until it sounds like fret 9.</li><li><code>x</code> muted, percussive hit. <code>PM</code> palm mute. <code>~</code> vibrato.</li></ul>
<p>Most tabs don't show rhythm. Listen to the song while you read, or use the metronome on the Practice tab.</p>
{{tab:power}}`,
    tasks:["Play the power-chord riff above from the tab","Find the symbols h, p and / in a tab of a song you like"] },
  { id:"color", level:"l2", title:"Sevenths and sus chords", min:15, body:`
<p>Add or lift one finger from a chord you know and you get a new color. These are the chords that make songs sound "finished" instead of beginner-ish.</p>
<h3>Dominant 7ths: tension that wants to resolve</h3>
<p>A 7th chord pulls toward the chord a fifth below. Play <b>E7 → Am</b> or <b>D7 → G</b> and hear the pull.</p>
{{chords:A7,B7,C7,D7,E7,G7}}
{{prog:D7,G,E7,Am}}
<h3>Sus chords: decorations on the same shape</h3>
<p>"Sus" means the 3rd of the chord is replaced. On D, hammer your pinky on and off the high e string while strumming: D – Dsus4 – D – Dsus2. That's a move you've heard on countless records.</p>
{{chords:Dsus2,D,Dsus4,Asus2,A,Asus4}}
{{prog:D,Dsus4,D,Dsus2,A,Asus4,A,Asus2}}
<h3>Major 7ths: soft and dreamy</h3>
{{chords:Cmaj7,Fmaj7,Amaj7,Dmaj7}}`,
    tasks:["Play D – Dsus4 – D – Dsus2 smoothly","Use B7 → Em in Wayfaring Stranger","Swap F for Fmaj7 in a song and compare"] },
  { id:"power", level:"l2", title:"Power chords and palm muting", min:15, body:`
<p>A power chord is just two notes: a root and the note a fifth above (often with the octave). There is no major or minor, so it fits almost anywhere, and it sounds great with distortion.</p>
{{chords:E5,A5,D5,G5}}
<h3>The movable shape</h3>
<p>Put your 1st finger on the low E or A string, and your 3rd finger two frets higher on the next string. Slide that shape anywhere. The note under your first finger names the chord.</p>
{{fret:rootNotes}}
<h3>Palm muting</h3>
<p>Rest the edge of your picking hand on the strings right where they leave the bridge. Too far forward and the notes die; too far back and they ring. Aim for a tight, punchy "chug".</p>
{{tab:power}}`,
    tasks:["Play the riff above with palm muting","Name the power chord at the 5th fret of the low E (A5) and 3rd fret of the A string (C5)"] },
  { id:"capo", level:"l2", title:"Capo and transposing", min:10, body:`
<p>A capo moves the nut up the neck so you can keep easy open shapes but play in a higher key. Each fret raises everything by one semitone.</p>
<div class="tablewrap"><table class="keys"><thead><tr><th>Capo</th><th>G shape sounds as</th><th>C shape</th><th>D shape</th><th>Em shape</th></tr></thead><tbody>
<tr><td>1</td><td>Ab</td><td>C#</td><td>Eb</td><td>Fm</td></tr><tr><td>2</td><td>A</td><td>D</td><td>E</td><td>F#m</td></tr><tr><td>3</td><td>Bb</td><td>Eb</td><td>F</td><td>Gm</td></tr><tr><td>4</td><td>B</td><td>E</td><td>F#</td><td>G#m</td></tr><tr><td>5</td><td>C</td><td>F</td><td>G</td><td>Am</td></tr><tr><td>7</td><td>D</td><td>G</td><td>A</td><td>Bm</td></tr></tbody></table></div>
<p>When a song is too low or too high for your voice, use the <b>transpose</b> buttons in the songbook, then either learn the new chords or use a capo to keep the familiar shapes.</p>
<p class="note">Rule of thumb: if a transposed song is full of barre chords, transpose it back down and put a capo on instead.</p>`,
    tasks:["Play Amazing Grace with capo 2 and sing along","Transpose a song in the songbook so it suits your voice"] },
  { id:"barre", level:"l3", title:"Conquering the F chord", min:25, body:`
<p>F is where many players stall. It takes a few weeks of short daily practice, not one long session. Work up to it with stepping stones.</p>
<h3>Stepping stones</h3>
<ol><li><b>Fmaj7</b>: no barre, same top-string shape. Get comfortable with the stretch.</li><li><b>Mini F</b> (xx3211): your 1st finger flattens across only the top two strings.</li><li><b>Full F</b>: the whole barre. Then <b>Bm</b>, which is the same idea on the A string.</li></ol>
{{chords:Fmaj7,F,Bm}}
<h3>What actually makes a barre ring</h3>
<ul><li>Roll the 1st finger slightly onto its bony outer edge. The soft middle side has creases that leave strings dead.</li><li>Place the barre right behind the fret, not in the middle.</li><li>Pull back with your arm rather than squeezing harder with your thumb. Let your arm's weight do the work.</li><li>Pluck string by string, find the dead one, adjust only that finger.</li></ul>
{{prog:C,F,G,C}}
<p class="note">Limit barre practice to 5–10 minutes at a time. Hand pain is a sign to rest, not to push harder.</p>`,
    tasks:["All six strings ring on F when picked one at a time","C → F → G → C at 60 BPM, one strum per beat","Play House of the Rising Sun with the full F"] },
  { id:"shapes", level:"l3", title:"Movable E and A shapes", min:20, body:`
<p>A full barre chord is an open E or A chord with your first finger acting as the nut. Slide the shape up and you get every major and minor chord.</p>
{{tab:shapes}}
<ul><li><b>E-shape</b>: root on the 6th string. F = 1st fret, G = 3rd, A = 5th.</li><li><b>A-shape</b>: root on the 5th string. Bb = 1st fret, B = 2nd, C = 3rd, D = 5th.</li><li>Minor versions: E-shape lifts the 2nd finger (F → Fm). A-shape becomes the Bm shape.</li></ul>
<h3>Learn the notes on the bottom two strings</h3>
<p>You only need the natural notes on the E and A strings to find any barre chord. The dots on frets 3, 5, 7, 9 and 12 are your landmarks.</p>
{{fret:rootNotes}}
{{chords:F#m,C#m,Bb}}`,
    tasks:["Find G, A and C as E-shape barre chords","Find C, D and E as A-shape barre chords","Play F#m and C#m in a song"] },
  { id:"finger", level:"l4", title:"Fingerpicking patterns", min:25, body:`
<p>Assign your picking-hand fingers to strings: <b>thumb (T)</b> takes the bass strings, <b>index (i)</b> the G string, <b>middle (m)</b> the B string, <b>ring (a)</b> the high e.</p>
<h3>The arpeggio: House of the Rising Sun</h3>
<p>Bass note, then up the strings and back down. Six notes per chord, in 6/8 time.</p>
{{tab:rising}}
<h3>Travis picking</h3>
<p>The thumb alternates between two bass strings on every beat while the fingers fill in between. Get the thumb on autopilot first: play only the bass notes until you can do it without thinking.</p>
{{tab:travisC}}
<p class="note">Slow is the shortcut. At 60 BPM a pattern you can play evenly is worth more than a fast messy one.</p>`,
    tasks:["Play the Rising Sun arpeggio through all chords at 90 BPM","Keep the Travis thumb steady over C and G for one minute","Fingerpick Scarborough Fair with the arpeggio pattern"] },
  { id:"penta", level:"l4", title:"Your first scale: A minor pentatonic", min:20, body:`
<p>Five notes, two per string, in one box at the 5th fret. This is the scale behind most rock and blues solos, and it's the easiest way to start improvising.</p>
{{fret:pentaAm}}
<p>The brass dots are <b>A</b>, the root. Start and end your licks on them and you'll sound resolved.</p>
{{tab:penta}}
<h3>Practice plan</h3>
<ol><li>Play it up and down with alternate picking (down-up-down-up) at 70 BPM.</li><li>Play over the 12-bar blues shuffle in the Songs tab, or have a friend strum Am – G.</li><li>Make up a 4-note phrase, repeat it, then change one note.</li></ol>`,
    tasks:["Play the box up and down from memory","Play it evenly at 90 BPM with alternate picking","Improvise for two minutes over Am"] },
  { id:"legato", level:"l4", title:"Hammer-ons, pull-offs, slides and bends", min:20, body:`
<p>These techniques let you play notes without picking each one. Lines sound smoother and more like a voice.</p>
<h3>Hammer-ons and pull-offs</h3>
<p>Pick the first note only. Hammer the next finger down firmly, then pull it off with a small downward flick so the lower note sounds.</p>
{{tab:legato}}
<h3>Slides and bends</h3>
<p>For slides keep the pressure on while moving. For bends, use three fingers together on the string and push it toward the ceiling until it reaches the target pitch.</p>
{{tab:slides}}`,
    tasks:["Each hammer-on is as loud as the picked note","Bend the G string at fret 9 up a whole step in tune"] },
  { id:"keys", level:"l5", title:"Keys and chord families", min:20, body:`
<p>In any major key, six chords belong together. They are numbered with Roman numerals. Learn this and you can guess the chords to most pop and folk songs.</p>
<div class="tablewrap"><table class="keys"><thead><tr><th>Key</th><th>I</th><th>ii</th><th>iii</th><th>IV</th><th>V</th><th>vi</th></tr></thead><tbody>
<tr><td><b>C</b></td><td>C</td><td>Dm</td><td>Em</td><td>F</td><td>G</td><td>Am</td></tr>
<tr><td><b>G</b></td><td>G</td><td>Am</td><td>Bm</td><td>C</td><td>D</td><td>Em</td></tr>
<tr><td><b>D</b></td><td>D</td><td>Em</td><td>F#m</td><td>G</td><td>A</td><td>Bm</td></tr>
<tr><td><b>A</b></td><td>A</td><td>Bm</td><td>C#m</td><td>D</td><td>E</td><td>F#m</td></tr>
<tr><td><b>E</b></td><td>E</td><td>F#m</td><td>G#m</td><td>A</td><td>B</td><td>C#m</td></tr></tbody></table></div>
<h3>Progressions you'll hear everywhere</h3>
<p><b>I – V – vi – IV</b> in G:</p>{{prog:G,D,Em,C}}
<p><b>I – vi – IV – V</b>, the 50s progression, in C:</p>{{prog:C,Am,F,G}}
<p><b>12-bar blues</b> in E uses I, IV and V: four bars of E, two of A, two of E, then B7, A, E, B7.</p>{{tab:shuffle}}`,
    tasks:["Play I – V – vi – IV in G, C and D","Play the 12-bar blues shuffle all the way through","Work out which key a song in the songbook is in"] },
];

const THEORY = [
  { id:"notes", level:"l5", title:"Notes and the fretboard", min:15, body:`
<p>Western music uses only 12 notes, then repeats them higher and lower. The natural notes are <b>A B C D E F G</b>. Between most pairs sits one more note, a sharp or flat, <b>except between B–C and E–F</b>, which are already a half step apart.</p>
<div class="tabblock"><pre>A   A#  B   C   C#  D   D#  E   F   F#  G   G#  A
    Bb          Db      Eb          Gb      Ab</pre></div>
<ul><li><b>One fret = one half step</b> (semitone). Two frets = a whole step (tone).</li><li>A sharp (#) raises a note by one fret, a flat (b) lowers it by one fret. C# and Db are the same fret: one sound, two names.</li><li>The <b>12th fret</b> is the octave: the same notes as the open strings, one octave up. Everything repeats from there.</li><li>Open strings, thick to thin: <b>E A D G B E</b>. "Eddie Ate Dynamite, Good Bye Eddie."</li></ul>
<p>The natural notes on the two bass strings. These are the root notes for every barre and power chord:</p>
{{fret:rootNotes}}
<h3>Quiz yourself</h3>
{{tool:notequiz}}`,
    tasks:["Say the musical alphabet with sharps from A back to A","Name every natural note on the low E string up to fret 12","Get a streak of 10 on the note quiz"] },
  { id:"intervals", level:"l5", title:"Intervals: the distance between notes", min:15, body:`
<p>An interval is the distance between two notes, counted in half steps (frets). Melodies are made of intervals, and so are chords: a major chord is a root plus a major 3rd plus a perfect 5th.</p>
<h3>Intervals on the guitar</h3>
<ul><li><b>Same string:</b> the number of frets is the number of half steps.</li><li><b>Next string, same fret:</b> a perfect 4th (5 half steps). The exception is G to B, which is a major 3rd. That's why chord shapes bend on the B string.</li><li><b>Next string, two frets up:</b> a perfect 5th. That is the power chord shape.</li><li><b>Two strings over, two frets up:</b> an octave (from the E, A or D string).</li></ul>
{{tool:intervals}}
<p class="note">Sing along. If you can sing an interval you'll start to hear it in songs, and working out songs by ear gets much easier.</p>`,

  { id:"triads", level:"l5", title:"How chords are built", min:20, body:`
<p>A chord is three or more notes played together. Most chords are built by stacking <b>3rds</b>: every other note of a scale. Three notes make a <b>triad</b>.</p>
<ul><li><b>Major</b> = root + major 3rd (4 half steps) + perfect 5th (7). C major is C E G. It sounds bright.</li><li><b>Minor</b> = root + minor 3rd (3) + perfect 5th. C minor is C Eb G. Move one note down one fret and the mood flips.</li><li><b>7th chords</b> add a fourth note. The dominant 7 (♭7) adds tension that wants to resolve; major 7 is dreamy; minor 7 is smooth.</li><li><b>Sus chords</b> swap the 3rd for a 2nd or a 4th, so they are neither major nor minor.</li><li><b>Power chords</b> leave out the 3rd completely, which is why they work under distortion.</li></ul>
<p>A six-string chord just doubles some of those notes. Open C (x32010) plays C E G C E: only three different notes.</p>
{{tool:builder}}
<p class="note">Compare E and Em, A and Am, D and Dm. Each time only the 3rd moves, by one fret, and that one note decides major or minor.</p>`,
    tasks:["Name the three notes in G, D and Em","Find the 3rd in your open E chord and lower it to make Em","Build C7 in the builder, then play C7 → F and hear the pull"] },
  { id:"scale", level:"l5", title:"The major scale and keys", min:20, body:`
<p>The major scale is the do-re-mi everyone knows. It always follows the same pattern of whole (W) and half (H) steps: <b>W W H W W W H</b>. Start the pattern on any note and you get that note's major scale.</p>
{{tab:cmajor}}
<h3>From the scale to the chords in a key</h3>
<p>Build a triad on every note of the scale, using only notes from that scale, and you get the chord family of the key: three major chords (<b>I, IV, V</b>), three minor chords (<b>ii, iii, vi</b>) and one diminished chord (<b>vii°</b>). That is why G, C, D and Em sound right together: they all come from the G major scale.</p>
{{tool:keyexplorer}}
<p><b>Relative minor:</b> the vi chord names the relative minor key. A minor uses exactly the same notes as C major, centred on A. Minor-key songs like Greensleeves and House of the Rising Sun borrow E (major) from outside the key to get a stronger pull back home.</p>`,

const TAB_LINE = /^\s*[eEBGDAbgda][#b]?\s*[|:]?[-0-9hpbrxs\/\\~|()<>.^*=t ]*-{3,}[-0-9hpbrxs\/\\~|()<>.^*=t ]*\|?\s*$/;

}

}

  while ((m = re.exec(line))){

// parse song body into renderable lines
function parseSong(text, st = 0){
  const out = []; const meta = {};
  const lines = String(text).replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  for (let raw of lines){
    const dir = raw.match(/^\s*\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/i);
    if (dir){
      const k = dir[1].toLowerCase(), v = dir[2] || "";

      else if (["soc","start_of_chorus"].includes(k)) out.push({ t:"sec", text:"Chorus" });
      else if (["sov","start_of_verse"].includes(k)) out.push({ t:"sec", text:v || "Verse" });
      else if (["sot","start_of_tab"].includes(k)) out.push({ t:"sec", text:v || "Tab" });
      else if (["t","title","st","subtitle","artist","key","capo","tempo","time"].includes(k)) meta[k === "t" ? "title" : k === "st" ? "subtitle" : k] = v;
      continue;
    }
    if (!raw.trim()){ out.push({ t:"blank" }); continue; }
    if (TAB_LINE.test(raw)){ out.push({ t:"tab", text:raw }); continue; }
    if (SECTION.test(raw)){ out.push({ t:"sec", text:raw.trim().replace(/^\[|\]$|:$/g, "").trim() }); continue; }
    if (hasInline(raw)){
      const { chords, lyrics } = inlineToPair(raw);
      out.push({ t:"chords", text: transposeChordLine(chords, st) });
      if (lyrics.trim()) out.push({ t:"lyric", text:lyrics });
      continue;
    }
    if (isChordLine(raw)){ out.push({ t:"chords", text: transposeChordLine(raw, st) }); continue; }
    out.push({ t:"lyric", text:raw });
  }

}

  return set;
}
function renderSheet(text, st = 0){
  const { lines } = parseSong(text, st);

    if (l.t === "blank") return `<div class="ln"> </div>`;
    if (l.t === "sec") return `<div class="ln sec">${esc(l.text)}</div>`;
    if (l.t === "cmt") return `<div class="ln cmt">${esc(l.text)}</div>`;

const Store = {
  mode:"local", db:null, uidv:null, songs:[], progress:{ done:{}, tasks:{}, records:{} }, ready:false, listeners:[],
  async init(){

    this.ready = true; this.emit();
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.db = db; this.uidv = id; this.mode = "cloud";
      const coll = db.collection("data/users/" + id);
      const timer = setTimeout(() => toast("Your saved songs can't be reached yet. Showing this device's copy."), 10000);
      coll.onSnapshot(snap => {
        clearTimeout(timer);
        const songs = [], imgs = {}; let prog = null;
        for (const d of snap.docs){ const v = d.data(); if (!v) continue; if (d.id.startsWith("song_")) songs.push(v); else if (d.id === "progress") prog = v; }
        songs.sort((a,b) => (b.updated || 0) - (a.updated || 0));

        if (!this._merged){ this._merged = true; const local = lsGet("fw.songs", []); for (const s of local) if (!songs.find(x => x.id === s.id)) { songs.push(s); this._write("song_" + s.id, s); } }
        this.songs = songs; if (prog) this.progress = Object.assign({ done:{}, tasks:{}, records:{} }, prog);
        this.emit();
      }, () => { clearTimeout(timer); toast("Cloud sync stopped. Changes are saved on this device."); this.mode = "local"; });
    } catch { /* stay local */ }
  },
  q:Promise.resolve(),
  _write(docId, data){ if (!this.db) return; const ref = this.db.collection("data/users/" + this.uidv).doc(docId); this.q = this.q.then(() => data == null ? ref.delete() : ref.set(data)).catch(() => toast("Couldn't sync that change. It's kept on this device.")); },
  _imgs(id){ return lsGet("fw.img." + id, null); },
  async images(song){

    const out = [];

  saveImage(src){ const id = uid(); lsSet("fw.img." + id, src); this._write("img_" + id, { src }); return id; },

      let best = 0; t.forEach((m, i) => { if (Math.abs(midi - m) < Math.abs(midi - t[best])) best = i; });
      const target = Math.abs(midi - t[best]) < 3.5 ? t[best] : Math.round(midi);
      const cents = Math.max(-50, Math.min(50, (midi - target) * 100));
      needle.style.transform = `rotate(${cents * 1.8}deg)`;
      tnote.innerHTML = `${NICE[((target % 12) + 12) % 12]}<sub>${Math.floor(target/12) - 1}</sub>`;
      tread.textContent = `${f.toFixed(1)} Hz · target ${midiToFreq(target).toFixed(1)} Hz · ${cents >= 0 ? "+" : ""}${cents.toFixed(0)} ¢`;
      const ok = Math.abs(cents) < 5;
      tstat.textContent = ok ? "In tune" : cents < 0 ? "Too low: tighten" : "Too high: loosen";
      tstat.style.color = ok ? "#45c27a" : "#f4ead6";
      const act = t.includes(target) ? t.indexOf(target) : -1;
      if (act !== lastActive || ok !== lastOk){ drawStrings(act, ok); lastActive = act; lastOk = ok; }
    }, err => {
      btn.innerHTML = ICON.play + "Start tuner";
      tread.textContent = err === "denied" ? "Microphone access was blocked." : "No microphone is available here.";
      $("#tmsg", el).innerHTML = (window.claude
        ? "The live tuner can't use the microphone inside Claude's viewer. Open the standalone app (<b>guitar/index.html</b>) in Chrome, Safari or Firefox to use it. "
        : err === "denied" ? "Allow microphone access for this page in your browser's site settings, then press Start again. " : "Connect a microphone, or open this page over https or from your own computer. ")
        + "Meanwhile, tune by ear: tap a string, then match it.";
    });
  });
  return el;
}

/* ===================== METRONOME / strum player / trainer ===================== */
const Metro = {
  bpm:80, beats:4, running:false, next:0, beat:0, timer:0, onBeat:null,
  start(onBeat){ const ctx = Audio.ensure(); if (!ctx) return; this.onBeat = onBeat; this.running = true; this.beat = 0; this.next = ctx.currentTime + 0.08;
    this.timer = setInterval(() => { while (this.next < ctx.currentTime + 0.12){ const b = this.beat; Audio.click(this.next, b === 0); const delay = (this.next - ctx.currentTime) * 1000; setTimeout(() => this.running && this.onBeat && this.onBeat(b), Math.max(0, delay)); this.next += 60 / this.bpm; this.beat = (this.beat + 1) % this.beats; } }, 25); },
  stop(){ this.running = false; clearInterval(this.timer); },
};
const StrumPlayer = {
  running:false, timer:0,
  start(pattern, chords, bpm, onStep){ // pattern: 8 chars D/U/.
    const ctx = Audio.ensure(); if (!ctx) return; this.running = true; let step = 0, ci = 0; let next = ctx.currentTime + 0.1; const stepDur = 60 / bpm / 2;
    this.timer = setInterval(() => { while (next < ctx.currentTime + 0.12){ const s = step % pattern.length; const c = chords[ci % chords.length]; const ch = pattern[s];
      if (ch === "D") Audio.strum(c, { when: next - ctx.currentTime, vol: s === 0 ? 0.36 : 0.26, gap: 0.014, dur: 1.4 });
      if (ch === "U") Audio.strum(c, { when: next - ctx.currentTime, up: true, vol: 0.2, gap: 0.012, dur: 1.2 });
      if (s === 0 && pattern.length <= 6) Audio.click(next, false);
      const d = (next - ctx.currentTime) * 1000, cs = s, cci = ci; setTimeout(() => this.running && onStep(cs, cci % chords.length), Math.max(0, d));
      next += stepDur; step++; if (step % pattern.length === 0) ci++; } }, 25); },
  stop(){ this.running = false; clearInterval(this.timer); },
};
const Trainer = { running:false, stop(){ this.running = false; Metro.stop(); } };
const AutoScroll = { raf:0, on:false, speed:1, acc:0, last:0,
  start(){ this.on = true; this.last = performance.now(); const step = t => { if (!this.on) return; const dt = t - this.last; this.last = t; this.acc += dt * this.speed * 0.012; if (this.acc >= 1){ window.scrollBy(0, Math.floor(this.acc)); this.acc -= Math.floor(this.acc); } if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2){ this.stop(); const b = $("#ascroll"); if (b) b.innerHTML = ICON.play + "Scroll"; } this.raf = requestAnimationFrame(step); }; this.raf = requestAnimationFrame(step); },
  stop(){ this.on = false; cancelAnimationFrame(this.raf); } };

  const row = s => { const cs = chordsInSong(s.body).slice(0, 6); return `<button class="songrow" data-song="${esc(s.id)}"><span class="keybadge ${s.user ? "user" : ""}">${esc(s.key || cs[0] || "♪")}</span><span class="grow"><span class="t">${esc(s.title || "Untitled")}</span><br><span class="meta">${esc(s.artist || "Unknown artist")}${cs.length ? " · " + esc(cs.join(" ")) : ""}${s.images?.length ? " · screenshot" : ""}</span></span>${s.level ? `<span class="chip ${s.level === "Easy" ? "easy" : "mid"}">${esc(s.level)}</span>` : ""}</button>`; };
  const match = s => { if (filter === "mine" && !s.user) return false; if ((filter === "Easy" || filter === "Intermediate") && s.level !== filter) return false; if (!q) return true; const hay = (s.title + " " + s.artist + " " + chordsInSong(s.body).join(" ")).toLowerCase(); return q.toLowerCase().split(/\s+/).every(w => hay.includes(w)); };
  const draw = () => {
    const mine = Store.songs.map(s => ({ ...s, user:true })).filter(match);
    const showMine = filter === "all" || filter === "mine" || mine.length;
    $("#mine", el).innerHTML = showMine ? `<h2>My songs</h2>` + (Store.songs.length ? (mine.length ? `<div class="songlist">${mine.map(row).join("")}</div>` : `<p class="small muted">No matches.</p>`)
      : `<div class="empty"><b>Your songs will appear here</b><p class="small muted">Paste chords or a tab from any website, or add a screenshot of a song sheet. ${Store.mode === "cloud" ? "They're saved to your Claude account." : "They're saved in this browser."}</p><button class="btn primary" data-new>${ICON.plus}Add your first song</button></div>`) : "";
    const b = BUILTIN.filter(match); $("#built", el).innerHTML = b.length ? b.map(row).join("") : `<p class="small muted">No matches.</p>`;
    $("#built", el).parentElement.hidden = filter === "mine";
    const k = knownSet(); const sug = songPool().filter(x => x.kind === "suggest").filter(x => !q || q.toLowerCase().split(/\s+/).every(w => (x.t + " " + x.a + " " + x.chords.join(" ")).toLowerCase().includes(w))).sort((a, b) => missingFor(a, k).length - missingFor(b, k).length);
    $("#sug", el).innerHTML = sug.length ? sug.map(x => poolRow(x, k)).join("") : `<p class="small muted">No matches.</p>`;
    $("#sugwrap", el).hidden = filter !== "all";
  };
  draw();
  $("#sq", el).oninput = e => { q = e.target.value.trim(); draw(); };
  $("#sf", el).onclick = e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f; [...$("#sf", el).children].forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
  el.addEventListener("click", e => { const s = e.target.closest("[data-song]"); if (s){ state.transpose = 0; navTo("songs", s.dataset.song); } if (e.target.closest("[data-new]")) navTo("songs", "new"); });
  $("#sNew", el).onclick = () => navTo("songs", "new");
  $("#sExport", el).onclick = exportBackup;
  $("#sImport", el).onclick = () => { const p = $("#jsonpick"); p.value = ""; p.onchange = () => importFile(p.files[0]); p.click(); };
  return el;
}
async function exportBackup(){
  const songs = []; for (const s of Store.songs){ songs.push({ ...s, imageData: await Store.images(s) }); }
  const data = JSON.stringify({ app:"fretwise", version:1, exported:new Date().toISOString(), songs, progress:Store.progress }, null, 1);
  const filename = "fretwise-songbook-" + new Date().toISOString().slice(0,10) + ".json";
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl){ await dl.save({ filename, data }); toast("Backup saved"); return; }
  } catch (e){ if (e && e.code === "declined") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type:"application/json" })); a.download = filename; document.body.append(a); a.click(); a.remove(); toast("Backup downloaded"); }
  catch { toast("Couldn't save the file in this view"); }
}
async function importFile(file){
  if (!file) return; const text = await file.text();
  let obj = null; try { obj = JSON.parse(text); } catch {}
  if (obj && Array.isArray(obj.songs)){
    let n = 0; for (const s of obj.songs){ const images = (s.imageData || []).map(src => Store.saveImage(src)); const { imageData, user, ...rest } = s; Store.saveSong({ ...rest, id: rest.id || uid(), images }); n++; }
    if (obj.progress) { Store.progress = Object.assign({ done:{}, tasks:{}, records:{} }, obj.progress); Store.saveProgress(); }
    toast(`Imported ${n} song${n === 1 ? "" : "s"}`); render(); return;
  }
  // plain text / ChordPro file → open editor prefilled
  const { meta } = parseSong(text); state.draft = { title: meta.title || file.name.replace(/\.[^.]+$/, ""), artist: meta.artist || meta.subtitle || "", key: meta.key || "", capo: +meta.capo || 0, body: text.replace(/^\s*\{\s*(t|title|st|subtitle|artist|key|capo)\s*:[^}]*\}\s*$/gim, "").trim() };
  navTo("songs", "new");
}

/* ===================== song editor + screenshot import ===================== */
async function downscale(file, maxW = 1400, budget = 180000){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    let w = img.naturalWidth, hgt = img.naturalHeight; const scale = Math.min(1, maxW / w); w = Math.round(w * scale); hgt = Math.round(hgt * scale);
    const c = document.createElement("canvas"); let q = 0.82, out;
    for (let tries = 0; tries < 8; tries++){
      c.width = w; c.height = hgt; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, hgt); g.drawImage(img, 0, 0, w, hgt);
      out = c.toDataURL("image/jpeg", q); if (out.length < budget * 1.33) break;
      if (q > 0.5) q -= 0.12; else { w = Math.round(w * 0.8); hgt = Math.round(hgt * 0.8); }
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}
const dataUrlToBlob = async d => (await fetch(d)).blob();
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); }); }

function viewEditor(existing){
  const draft = existing ? { ...existing } : Object.assign({ title:"", artist:"", key:"", capo:0, tuning:"Standard", strum:"", level:"", body:"", images:[] }, state.draft || {});
  state.draft = null;
  const pending = []; // newly added screenshots (data URLs) not saved yet
  const el = h(`<section class="view">
    <div class="row"><button class="btn ghost sm" data-back>${ICON.back}${existing ? "Back to song" : "Songbook"}</button></div>
    <div><p class="eyebrow">${existing ? "Edit song" : "New song"}</p><h1>${existing ? esc(existing.title || "Untitled") : "Add a song"}</h1></div>
    <div class="panel" style="display:grid;gap:12px">
      <h2>From a screenshot</h2>
      <div class="drop" id="drop">
        <p><b>Drop screenshots here</b>, paste an image (Ctrl/⌘ V), or</p>
        <button class="btn" id="pick">Choose images</button>

      <div class="thumbs" id="thumbs"></div>

          <div class="field"><label for="eKey">Key</label><input type="text" id="eKey" value="${esc(draft.key)}" placeholder="e.g. G"></div>
          <div class="field"><label for="eCapo">Capo</label><input type="number" id="eCapo" min="0" max="12" value="${+draft.capo || 0}"></div>
          <div class="field"><label for="eLevel">Level</label><select id="eLevel">${["","Easy","Intermediate","Hard"].map(v => `<option value="${v}" ${draft.level === v ? "selected" : ""}>${v || "—"}</option>`).join("")}</select></div>
          <div class="field"><label for="eTuning">Tuning</label><select id="eTuning">${Object.keys(TUNINGS).map(v => `<option ${draft.tuning === v ? "selected" : ""}>${v}</option>`).join("")}</select></div>
          <div class="field" style="grid-column:1/-1"><label for="eStrum">Strumming / picking</label><input type="text" id="eStrum" value="${esc(draft.strum)}" placeholder="e.g. D DU UDU"></div>
        </div>
        <div class="field"><label for="eBody">Chords, lyrics and tabs</label><textarea id="eBody" spellcheck="false" placeholder="${esc(`Paste from any chord or tab site. All of these work:

[Verse]
G             C          G
Chords above the lyrics, aligned with spaces

Or [G]inline chords in [C]brackets (ChordPro)

e|-----0---------|
B|---1---1-------|
G|-2-------2-----|`)}">${esc(draft.body)}</textarea></div>
        <div class="row"><button class="btn" id="tidy" hidden>Tidy up with Claude</button><span class="small muted" id="tidyStatus"></span></div>
      </div>
      <div style="display:grid;gap:8px;align-content:start"><p class="eyebrow">Preview</p><div id="pchords" class="chordstrip"></div><div class="sheet" id="preview" style="font-size:13px"></div></div>
    </div>
    <div class="row savebar"><button class="btn primary" id="save">Save song</button><button class="btn" data-back>Cancel</button></div>
  </section>`);
  const body = $("#eBody", el);
  const preview = () => { $("#preview", el).innerHTML = body.value.trim() ? renderSheet(body.value) : `<p class="muted small">Your formatted song will appear here.</p>`; const cs = chordsInSong(body.value); $("#pchords", el).innerHTML = cs.map(chordCard).join(""); };
  body.oninput = () => { clearTimeout(body._t); body._t = setTimeout(preview, 150); }; preview();
  // existing screenshots
  const thumbs = $("#thumbs", el); const kept = [...(draft.images || [])];
  const drawThumbs = async () => {
    const keptSrc = existing ? await Store.images({ images: kept }) : [];
    thumbs.innerHTML = [...keptSrc.map((src, i) => `<figure><img src="${esc(src)}" alt="Saved screenshot"><button data-rmk="${i}" aria-label="Remove screenshot">×</button></figure>`), ...pending.map((src, i) => `<figure><img src="${esc(src)}" alt="New screenshot"><button data-rmp="${i}" aria-label="Remove screenshot">×</button></figure>`)].join("");
    $("#ocrRow", el).hidden = !pending.length && !keptSrc.length;
  };
  drawThumbs();
  thumbs.onclick = e => { const k = e.target.dataset.rmk, p = e.target.dataset.rmp; if (k != null) kept.splice(+k, 1); if (p != null) pending.splice(+p, 1); drawThumbs(); };
  const addFiles = async files => { for (const f of files){ if (!f.type.startsWith("image/")) continue; try { pending.push(await downscale(f)); } catch { toast("Couldn't read that image"); } } drawThumbs(); };
  $("#pick", el).onclick = () => { const p = $("#filepick"); p.value = ""; p.onchange = () => addFiles([...p.files]); p.click(); };
  const drop = $("#drop", el);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files]); };
  const onPaste = e => { if (!document.body.contains(el)) { document.removeEventListener("paste", onPaste); return; } const files = [...(e.clipboardData?.files || [])].filter(f => f.type.startsWith("image/")); if (files.length){ e.preventDefault(); addFiles(files); } };
  document.addEventListener("paste", onPaste);

  // reading: Claude vision inside Claude, Tesseract OCR elsewhere
  const status = $("#ocrStatus", el), readBtn = $("#readBtn", el);
  Claude.canImages().then(ok => { if (ok) $("#ocrHint", el).textContent = "Claude reads the chords, lyrics and tab from your screenshot and lays them out so you can transpose them. The screenshot is also saved with the song."; });
  Claude.sample().then(s => { if (s) $("#tidy", el).hidden = false; });
  readBtn.onclick = async () => {
    const srcs = [...(existing ? await Store.images({ images: kept }) : []), ...pending]; if (!srcs.length) return;
    readBtn.disabled = true; status.textContent = "Reading…";
    try {
      if (await Claude.canImages()){
        const s = await Claude.sample(); const blobs = await Promise.all(srcs.map(dataUrlToBlob));
        const lim = (await s.limits()).images; const imgs = blobs.slice(0, lim.maxCount);
        status.textContent = "Claude is reading the screenshot. This takes up to a minute…";
        const res = await s.json(`These images are screenshots of a guitar song sheet (chords, lyrics and/or tablature), possibly several pages in order. Transcribe them.
Return JSON: {"title": string, "artist": string, "key": string, "capo": number, "strum": string, "body": string}. Use "" or 0 when not shown.
${PROMPT_FORMAT}`, { images: imgs, modelTier: "default" });
        applyResult(res);
        status.textContent = "Done. Check the text against the screenshot and fix anything misread.";
      } else {
        status.textContent = "Loading the text reader (first time only)…";
        if (!window.Tesseract) await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
        let text = "";
        for (let i = 0; i < srcs.length; i++){
          const r = await window.Tesseract.recognize(srcs[i], "eng", { logger: m => { if (m.status === "recognizing text") status.textContent = `Reading image ${i + 1}/${srcs.length}: ${Math.round(m.progress * 100)}%`; } });

        }
        body.value = (body.value.trim() ? body.value.trim() + "\n\n" : "") + cleanOcr(text); preview();
        status.textContent = "Text read. Chord alignment from screenshots is approximate, so compare with the image and adjust.";
      }
    } catch (e){
      if (e && e.code === "not_granted") status.textContent = "Claude wasn't allowed to read images. Type or paste the song instead; the screenshot is still saved.";
      else if (e && e.code === "rate_limited") status.textContent = "Too many requests right now. Try again in a minute.";
      else status.textContent = "Couldn't read the screenshot here. Save it as an image-only song, or type the chords in.";
    } finally { readBtn.disabled = false; }
  };
  function applyResult(res){
    if (!res || typeof res !== "object") return;
    if (res.title && !$("#eTitle", el).value) $("#eTitle", el).value = String(res.title);
    if (res.artist && !$("#eArtist", el).value) $("#eArtist", el).value = String(res.artist);

  $("#tidy", el).onclick = async () => {
    if (!body.value.trim()){ toast("Paste some chords or a tab first"); return; }

Return JSON: {"title": string, "artist": string, "key": string, "capo": number, "strum": string, "body": string}.
${PROMPT_FORMAT}

"""
${body.value.slice(0, 60000)}
"""`, { modelTier: "default" }); body.value = ""; applyResult(res); ts.textContent = "Tidied. Check the result."; }
    catch (e){ ts.textContent = e && e.code === "not_granted" ? "Claude wasn't allowed. Your text is unchanged." : "Couldn't tidy right now. Your text is unchanged."; }
    finally { b.disabled = false; }
  };

    const song = { ...(existing || {}), id: existing?.id || uid(),

      capo: parseInt($("#eCapo", el).value, 10) || 0, level: $("#eLevel", el).value, tuning: $("#eTuning", el).value, strum: $("#eStrum", el).value.trim(), body: body.value.replace(/\s+$/, "") };
    if (!song.body && !kept.length && !pending.length){ toast("Add some text or a screenshot first"); return; }
    if (existing) for (const im of existing.images || []) if (!kept.includes(im)){ try { localStorage.removeItem("fw.img." + im); } catch {} Store._write("img_" + im, null); }

  };
  el.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { document.removeEventListener("paste", onPaste); navTo("songs", existing ? existing.id : null); });
  return el;
}
function cleanOcr(t){
  return t.split("\n").map(l => l.replace(/\s+$/, "")
    .replace(/^([eBGDAE])\s*[|l1I!]\s*/, "$1|")          // tab string labels
    .replace(/[—–_]{1,}/g, m => "-".repeat(m.length))     // dashes
    .replace(/(?<=[-|])[oO](?=[-|])/g, "0")                // o → 0 in tabs
  ).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
